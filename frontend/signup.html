<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-lg text-body-lg text-on-background">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant shadow-sm flex flex-col overflow-hidden">
<div class="p-gutter border-b border-outline-variant bg-surface-container-lowest flex flex-col items-center justify-center space-y-4">
<div class="w-12 h-12 bg-primary flex items-center justify-center rounded">
<span class="material-symbols-outlined text-on-primary" style="font-size: 24px;">precision_manufacturing</span>
</div>
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">SmartRental</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Create an account to manage industrial logistics.</p>
</div>
</div>
<form class="p-gutter space-y-6" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-none px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Corporate Email</label>
<input class="w-full bg-surface border border-outline-variant rounded-none px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all" id="email" placeholder="jane.doe@company.com" required="" type="email"/>
</div>
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<input class="w-full bg-surface border border-outline-variant rounded-none px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="role">Select Role</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-none px-4 py-3 font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:border-primary focus:border-2 transition-all cursor-pointer" id="role">
<option value="viewer">VIEWER</option>
<option value="operator">OPERATOR</option>
<option value="manager">MANAGER</option>
<option value="admin">ADMIN</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</div>
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-headline-md text-headline-md py-4 rounded-none transition-colors mt-8" type="submit">
                Create Account
            </button>
<div class="text-center mt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary hover:text-surface-tint font-bold underline transition-colors" href="login.html">Log in</a>
</p>
</div>
<div class="text-center mt-8 pt-6 border-t border-outline-variant space-y-2">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-2 block" href="dashboard.html">
<span class="material-symbols-outlined text-body-sm" style="font-size: 18px;">settings</span>Settings
</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-2 block" href="dashboard.html">
<span class="material-symbols-outlined text-body-sm" style="font-size: 18px;">support_agent</span>Support
</a>
</div>
